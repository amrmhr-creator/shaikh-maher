# إعدادات لوحة التحرير Pages CMS (https://app.pagescms.org)
# الصور والملفات المرفوعة تُحفظ في public/media وتُكتب في المحتوى بمسار media/...
media:
  input: public/media
  output: media

content:
  - name: gallery
    label: مكتبة الصور
    type: collection
    path: src/content/gallery
    filename: "{year}{month}{day}-{hour}{minute}{second}.md"
    view:
      fields: [image, caption, person]
      primary: caption
      sort: [order]
    fields:
      - { name: image, label: الصورة, type: image, required: true }
      - { name: caption, label: التعليق تحت الصورة, type: string, required: true }
      - name: person
        label: الصورة لمن؟
        type: select
        default: maher
        options:
          values:
            - { value: maher, label: الشيخ ماهر }
            - { value: fathallah, label: الشيخ فتح الله }
            - { value: group, label: صورة جماعية }
            - { value: other, label: أخرى }
      - { name: order, label: الترتيب (الأصغر يظهر أولًا), type: number, default: 100 }

  - name: lessons
    label: الدروس الصوتية
    type: collection
    path: src/content/lessons
    filename: "{year}{month}{day}-{hour}{minute}{second}.md"
    view:
      fields: [number, title]
      primary: title
      sort: [number]
    fields:
      - { name: title, label: عنوان الدرس, type: string, required: true }
      - { name: number, label: رقم الدرس, type: number, required: true }
      - { name: series, label: السلسلة, type: string, default: "دروس الشيخ ماهر الصوتية" }
      - { name: audio, label: رابط الملف الصوتي, type: string, required: true }
      - { name: duration, label: "المدة (مثل 45:30)", type: string }
      - name: topics
        label: الموضوعات
        type: select
        options:
          multiple: true
          values:
            - { value: aqeedah, label: العقيدة والتوحيد }
            - { value: ibadat, label: الصلاة والعبادات }
            - { value: tazkiyah, label: تزكية النفس }
            - { value: tafsir, label: تأملات قرآنية }
            - { value: akhirah, label: اليوم الآخر }
            - { value: rizq, label: الرزق والبركة }
            - { value: dua, label: الدعاء }
      - { name: points, label: موضوعات الدرس, type: string, list: true }
      - { name: body, label: التفريغ النصي, type: rich-text }

  - name: fawaid
    label: الفوائد
    type: collection
    path: src/content/fawaid
    filename: "{year}{month}{day}-{hour}{minute}{second}.md"
    view:
      fields: [title, status]
      primary: title
    fields:
      - { name: title, label: عنوان الفائدة, type: string, required: true }
      - { name: quote, label: نص الفائدة من كلام الشيخ, type: text }
      - { name: summary, label: وصف قصير, type: text }
      - name: topics
        label: الموضوعات
        type: select
        options:
          multiple: true
          values:
            - { value: aqeedah, label: العقيدة والتوحيد }
            - { value: ibadat, label: الصلاة والعبادات }
            - { value: tazkiyah, label: تزكية النفس }
            - { value: tafsir, label: تأملات قرآنية }
            - { value: akhirah, label: اليوم الآخر }
            - { value: rizq, label: الرزق والبركة }
            - { value: dua, label: الدعاء }
      - name: source
        label: المصدر
        type: object
        fields:
          - name: kind
            label: نوع المصدر
            type: select
            options:
              values:
                - { value: lesson, label: درس صوتي }
                - { value: book, label: كتاب }
          - { name: ref, label: "اسم ملف المصدر (مثل 05 للدرس الخامس، أو rasayel)", type: string }
          - { name: at, label: "التوقيت في الدرس (مثل 12:30)", type: string }
          - { name: chapter, label: الفصل في الكتاب, type: string }
      - name: media
        label: مقطع مرفق
        type: object
        fields:
          - name: type
            label: النوع
            type: select
            options:
              values:
                - { value: video, label: فيديو }
                - { value: audio, label: صوت }
          - { name: url, label: الرابط, type: string }
      - name: status
        label: الحالة
        type: select
        default: draft
        options:
          values:
            - { value: draft, label: مسودة }
            - { value: review, label: قيد المراجعة }
            - { value: published, label: منشورة }

  - name: books
    label: الكتب والرسائل
    type: collection
    path: src/content/books
    view:
      fields: [title]
      primary: title
      sort: [order]
    fields:
      - { name: title, label: عنوان الكتاب, type: string, required: true }
      - { name: order, label: الترتيب, type: number, default: 10 }
      - { name: summary, label: وصف الكتاب, type: text, required: true }
      - { name: cover, label: الغلاف, type: image }
      - { name: pdf, label: رابط الكتاب كاملًا (PDF), type: string }
      - { name: chapterLabel, label: "عنوان قائمة الفصول (مثل: فصول الكتاب)", type: string }
      - name: chapters
        label: الفصول
        type: object
        list: true
        fields:
          - { name: title, label: عنوان الفصل, type: string }
          - { name: pdf, label: رابط PDF للفصل, type: string }
          - { name: thumb, label: صورة الصفحة الأولى, type: image }
